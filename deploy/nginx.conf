# Serve the Astro static build. Copy dist/ to `root` (the files themselves,
# not a nested dist/ directory). Nothing in this site needs a Node server.
#
#   npm run build
#   rsync -av --delete dist/ user@server:/var/www/davidgeorgehope.com/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name davidgeorgehope.com;

    root /var/www/davidgeorgehope.com;
    index index.html;

    charset utf-8;

    # Astro's default trailingSlash is "ignore": /blog and /blog/ both return
    # 200 with the same HTML. try_files does that without a redirect.
    # This site has no redirect rules.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Prerendered markdown endpoints (index.md, projects.md, writing.md).
    location ~* \.md$ {
        default_type text/markdown;
    }
}
